<!DOCTYPE html>
<html lang="vi" class="overlay-html">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Overlay</title>
<link rel="stylesheet" href="style.css">
<style>
  /* Extra safety so OBS always captures a transparent page even before CSS loads */
  html, body { background: transparent !important; }
</style>
</head>
<body class="overlay-page">

  <div id="overlay-root" class="overlay-stage style-minimal">
    <span id="line1" class="ov-line"></span>
    <span id="line2" class="ov-line"></span>
    <span id="line3" class="ov-line"></span>
  </div>

  <script src="script.js"></script>
  <script>
    (function () {
      const cfg = getConfigFromURL();
      let tickTimer = null;

      const els = {
        root: document.getElementById("overlay-root"),
        line1: document.getElementById("line1"),
        line2: document.getElementById("line2"),
        line3: document.getElementById("line3")
      };

      function tick() {
        renderOverlay(cfg, els);
      }

      function scheduleTicking() {
        if (tickTimer) clearInterval(tickTimer);
        // If any visible line uses {ms}, tick fast for a smooth counter.
        // Otherwise tick once per second, aligned to the second boundary
        // so the clock never visibly drifts.
        if (needsMsTicking(cfg)) {
          tickTimer = setInterval(tick, 50);
        } else {
          const msToNextSecond = 1000 - (Date.now() % 1000);
          setTimeout(function () {
            tick();
            tickTimer = setInterval(tick, 1000);
          }, msToNextSecond);
        }
      }

      tick();
      scheduleTicking();
    })();
  </script>
</body>
</html>
